k8sServiceHost: "localhost"
k8sServicePort: "7445"

securityContext:
  capabilities:
    ciliumAgent:
      - CHOWN

ingressController:
  enabled: true

gatewayAPI:
  enabled: true

encryption:
  enabled: true
  type: wireguard

ipam:
  mode: "kubernetes"

kubeProxyReplacement: "true"

cgroup:
  autoMount:
    enabled: false
